Summary: DNS-over-HTTPS, firewall, and network monitor.
Description: RethinkDNS + Firewall is an open-source Android app that combines DNS-over-HTTPS, a per-app firewall, and a network monitor. Block ads and trackers, control which apps can access the internet, route traffic through Tor or Orbot, and analyze your network traffic in real time. No root required.
