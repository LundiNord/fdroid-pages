Summary: Get Android app updates directly from the source.
Description: Obtainium allows you to install and update apps directly from their release pages on GitHub, GitLab, F-Droid, and many other sources. Bypass app stores and get updates as soon as they are published. Supports automatic background updates and a wide range of app sources.
