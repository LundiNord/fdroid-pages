Summary: Secure, decentralised communication via Matrix.
Description: Element is a decentralized, end-to-end encrypted messaging app built on the open Matrix protocol. Chat, call, and collaborate across platforms and servers. Join any Matrix homeserver or self-host your own. Supports rooms, spaces, voice/video calls, and file sharing.
