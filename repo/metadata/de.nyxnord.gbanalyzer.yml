Summary: Read-only analyzer for auto-exported Gadgetbridge databases.
Description: |-
    GB Analyzer is a read-only Android app that analyzes auto-exported
    Gadgetbridge databases. It shows daily steps, heart rate and sleep
    statistics (deep/light/REM) for the devices in the export, built with
    Jetpack Compose and Material3. The app has zero permissions by design
    and never writes to the database export.
