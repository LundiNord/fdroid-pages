Summary: Lightweight, privacy-friendly YouTube frontend.
Description: NewPipe is a free and open-source frontend for YouTube and other video platforms that does not use any Google APIs. Watch videos, listen to audio-only streams, download content, subscribe to channels, and manage playlists — all without a Google account or ads.
