Summary: Community-driven privacy-focused offline maps.
Description: CoMaps is a community fork of Organic Maps, a fast and detailed offline maps app based on OpenStreetMap. Navigate without internet, plan hiking and cycling routes, find points of interest, and explore the world without tracking or ads.
