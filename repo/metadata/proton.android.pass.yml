Summary: End-to-end encrypted password manager by Proton.
Description: Proton Pass is a free and open-source password manager from Proton. Store passwords, credit cards, identities, and notes with end-to-end encryption. Includes a built-in email alias service (SimpleLogin integration), autofill, 2FA TOTP support, and sharing capabilities.
