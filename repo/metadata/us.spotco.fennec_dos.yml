Summary: Privacy-hardened Firefox-based browser.
Description: Mull is a privacy-focused and deblobbed Firefox-based browser maintained by fiorenmma. It removes proprietary blobs from Firefox for Android and applies hardened privacy settings by default. Based on Mozilla's Fenix codebase with support for Firefox extensions. Part of the DivestOS project.
