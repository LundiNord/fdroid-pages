Summary: Beta channel of the Thunderbird email client for Android.
Description: Thunderbird Beta gives early access to upcoming features and fixes for the Thunderbird email client for Android. Supports IMAP/POP3/SMTP, OpenPGP encryption via OpenKeychain, push notifications, and multiple accounts. Expect occasional instability compared to the stable release.
