Summary: Password manager compatible with KeePass file format.
Description: KeePass2Android is a password manager app compatible with KeePass (.kdbx) files. Manage your passwords offline or sync with your preferred cloud provider. Supports fingerprint unlock, QuickUnlock, and integrates with the Android autofill framework. Compatible with KeePass 1.x and 2.x databases.
