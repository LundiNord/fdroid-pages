Summary: A local-first Android workout tracking app built with Jetpack Compose and Material3.
Description: KraftLog is a local-first Android workout tracking app built with Jetpack Compose and Material3. It allows you to track your workouts, create custom exercises and routines, and view your progress over time. KraftLog is designed to be simple and intuitive to use, while still providing powerful features for tracking your workouts.
