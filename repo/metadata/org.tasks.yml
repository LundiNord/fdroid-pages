Summary: Open-source to-do lists and reminders.
Description: Tasks is a fully open-source to-do app for Android. It supports Google Tasks, Microsoft To-Do, CalDAV/DAVx5 sync, local task lists, and rich features like subtasks, tags, geofencing reminders, and custom filters. No proprietary dependencies required.
