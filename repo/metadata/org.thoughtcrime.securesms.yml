Summary: Private end-to-end encrypted messenger.
Description: Signal is a free, open-source messaging app for private communication with friends. It uses end-to-end encryption to keep your conversations secure. Send messages, voice notes, photos, videos, GIFs, and files, as well as make voice and video calls. Designed to never collect or store any sensitive information.
