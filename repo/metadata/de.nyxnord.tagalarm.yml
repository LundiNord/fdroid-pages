Summary: A Bluetooth tag-based alarm app for Android.
Description: TagAlarm is an Android app that monitors connected Bluetooth Low Energy (BLE) devices and triggers alarms based on proximity or connection status. It runs as a persistent foreground service and starts automatically on device boot.
