Summary: Sync and share with your own Nextcloud server.
Description: The Nextcloud Android app allows you to access all your files on your Nextcloud server. Upload, download, sync photos and documents, and share files with others. Integrates with the Android system for auto-upload of photos and offline file access. Works with any Nextcloud server.
