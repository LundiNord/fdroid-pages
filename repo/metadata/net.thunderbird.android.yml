Summary: Open-source email client by Mozilla.
Description: Thunderbird for Android (formerly K-9 Mail) is a powerful, open-source email client from Mozilla. Manage multiple email accounts, supports IMAP/POP3/SMTP, OpenPGP encryption via OpenKeychain, push notifications, and rich message composition. Clean, customizable interface for all your email needs.
