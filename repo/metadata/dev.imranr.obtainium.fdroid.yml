Summary: Get Android app updates directly from the source — F-Droid build.
Description: Obtainium allows you to install and update apps directly from their release pages on GitHub, GitLab, F-Droid, and many other sources. This is the F-Droid-specific build variant. Bypass app stores and get updates as soon as they are published. Supports automatic background updates and a wide range of app sources.
