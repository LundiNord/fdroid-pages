Summary: Control your wearables without proprietary apps.
Description: Gadgetbridge is a free and open-source Android application that allows you to use pebble- and Mi Band-compatible devices without any proprietary apps or servers. Supports fitness trackers, smartwatches, and other Bluetooth gadgets from many manufacturers. Track health data locally on your device.
