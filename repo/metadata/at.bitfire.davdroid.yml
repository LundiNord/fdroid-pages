Summary: CalDAV/CardDAV sync adapter and client for Android.
Description: DAVx⁵ is an open-source CalDAV/CardDAV client and sync adapter for Android. Sync your calendars and contacts with Nextcloud, ownCloud, Fastmail, Mailbox.org, and any other DAV-compatible server. Supports two-way sync, OAuth 2.0, and client certificates.
