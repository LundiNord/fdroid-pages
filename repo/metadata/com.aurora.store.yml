Summary: Open-source alternative to the Google Play Store.
Description: Aurora Store is an unofficial, FOSS client to Google's Play Store with an elegant design. It lets you download, update, and search for apps without a Google account. Supports anonymous sessions, account login, and spoofing device properties.
