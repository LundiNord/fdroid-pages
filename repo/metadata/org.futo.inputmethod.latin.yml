Summary: Privacy-respecting keyboard with on-device voice input.
Description: FUTO Keyboard is a privacy-focused Android keyboard with on-device voice typing. It runs entirely locally without sending data to any server. Based on AOSP keyboard with improvements including swipe typing, voice input powered by Whisper, and no network permissions required.
