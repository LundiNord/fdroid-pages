Summary: Jellyfin music streaming client for Android.
Description: Finamp is an open-source Jellyfin music client for Android. Stream or download your music library from your Jellyfin server, create queues, manage playlists, and enjoy your music collection. Features offline playback, background audio, and a clean material interface.
