Summary: Official Jellyfin media streaming client.
Description: Jellyfin for Android is the official client for the Jellyfin media server. Stream your movies, TV shows, music, and photos from your own Jellyfin server. Features video playback with ExoPlayer, server management, and support for multiple users.
