Summary: Home Assistant companion app — minimal build without location tracking.
Description: The minimal variant of the Home Assistant Companion App for Android. Identical to the full version but without location tracking and related sensors. Suitable for devices where Google Play Services are unavailable or unwanted. Control your smart home and access dashboards from anywhere.
