name: Update

on:
  schedule:
    - cron: '35 0 * * *'
  workflow_dispatch:
    inputs:
      force_update:
        type: boolean
        description: 'Force update/build'
        default: false

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    outputs:
      executed_update: ${{ steps.postprocess.outputs.executed_update }}
    steps:
      - uses: actions/checkout@v4

      - name: Update
        id: update
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          declare -a repo_infos=(
            "de.nyxnord.kraftlog;github;LundiNord/KraftLog"
            "de.mensa_ka.app;github;kronos-et-al/MensaApp"
            "io.homeassistant.companion.android;github;home-assistant/android"
            "org.tasks;github;tasks/tasks"
            "xyz.blueskyweb.app;github;bluesky-social/social-app"
            "app.comaps;github;comaps/comaps"
            "at.bitfire.davdroid;github;bitfireAT/davx5-ose"
            "com.looker.droidify;github;Droid-ify/client"
            "im.vector.app;github;element-hq/element-android"
            "com.jmshrv.finamp;github;jmshrv/finamp"
            "org.futo.inputmethod.latin;github;futo-org/android-keyboard"
            "nodomain.freeyourgadget.gadgetbridge;github;Freeyourgadget/Gadgetbridge"
            "org.jellyfin.mobile;github;jellyfin/jellyfin-android"
            "keepass2android.keepass2android;github;PhilippC/keepass2android"
            "app.nagram;github;nicegram/Nagram"
            "org.schabi.newpipe;github;TeamNewPipe/NewPipe"
            "com.nextcloud.client;github;nextcloud/android"
            "dev.imranr.obtainium;github;ImranR98/Obtainium"
            "ch.protonmail.android;github;ProtonMail/proton-mail-android"
            "ch.protonvpn.android;github;ProtonVPN/android-app"
            "proton.android.pass;github;protonpass/android-pass"
            "me.proton.android.drive;github;ProtonMail/proton-drive-android"
            "me.proton.android.calendar;github;ProtonMail/proton-calendar-android"
            "com.lgallardo.qbittorrentclient;github;lgallardo/qbittorrent-client"
            "com.celzero.bravedns;github;celzero/rethink-app"
            "org.thoughtcrime.securesms;github;signalapp/Signal-Android"
            "net.thunderbird.android;github;thunderbird/thunderbird-android"
            "com.aurora.store;gitlab;AuroraOSS/AuroraStore"
            "us.spotco.fennec_dos;gitlab;divested-mobile/mull-fenix"
          )

          force_update="${{ inputs.force_update }}"
          
          if [[ "$force_update" != "true" ]]; then
            echo "Checking if updates are required..."

            update_required=false

            for repo_info in ${repo_infos[@]}; do
              repo_info_parts=(${repo_info//;/ })

              id=${repo_info_parts[0]}
              provider=${repo_info_parts[1]}
              repo=${repo_info_parts[2]}

              echo "Checking if $id needs updating"

              current_deployed_release=$(cat current-versions/$id.txt || echo "")
              echo "Currently deployed version is '$current_deployed_release'"

              latest_version=""
              if [[ "$provider" == "github" ]]; then
                latest_release_data=$(
                  curl -L \
                    -H "Accept: application/vnd.github+json" \
                    -H "Authorization: Bearer $GITHUB_TOKEN" \
                    -H "X-GitHub-Api-Version: 2022-11-28" \
                    https://api.github.com/repos/$repo/releases/latest
                )
                latest_version=$(echo "$latest_release_data" | jq -r '.name')
              elif [[ "$provider" == "gitlab" ]]; then
                encoded_repo="${repo//\//%2F}"
                latest_release_data=$(
                  curl -L \
                    "https://gitlab.com/api/v4/projects/$encoded_repo/releases?per_page=1"
                )
                latest_version=$(echo "$latest_release_data" | jq -r '.[0].tag_name')
              else
                echo "Unknown provider"
                exit 1
              fi

              echo "Latest version is '$latest_version'"
              if [[ "$current_deployed_release" != "$latest_version" ]]; then
                echo "Update required"
                update_required=true
                break
              fi
            done

            if [[ "$update_required" != "true" ]]; then
              echo "Everything is up-to-date; No update required"
              exit 0
            fi
          fi

          echo "Downloading APKs"
          mkdir -p apks
          rm -f /tmp/fdroid_download_errors

          for repo_info in ${repo_infos[@]}; do
            repo_info_parts=(${repo_info//;/ })

            id=${repo_info_parts[0]}
            provider=${repo_info_parts[1]}
            repo=${repo_info_parts[2]}

            echo "Downloading APKs for $id"

            latest_version=""
            if [[ "$provider" == "github" ]]; then
              curl -L \
                -H "Accept: application/vnd.github+json" \
                -H "Authorization: Bearer $GITHUB_TOKEN" \
                -H "X-GitHub-Api-Version: 2022-11-28" \
                https://api.github.com/repos/$repo/releases?per_page=3 \
                | jq -r '.[].assets[].browser_download_url' \
                | while read -r url; do wget -P apks --no-verbose "$url" || { echo "Warning: failed to download $url, skipping"; echo "$url" >> /tmp/fdroid_download_errors; }; done

              latest_release_data=$(
                curl -L \
                  -H "Accept: application/vnd.github+json" \
                  -H "Authorization: Bearer $GITHUB_TOKEN" \
                  -H "X-GitHub-Api-Version: 2022-11-28" \
                  https://api.github.com/repos/$repo/releases/latest
              )
              latest_version=$(echo "$latest_release_data" | jq -r '.name')
            elif [[ "$provider" == "gitlab" ]]; then
              encoded_repo="${repo//\//%2F}"
              curl -L \
                "https://gitlab.com/api/v4/projects/$encoded_repo/releases?per_page=3" \
                | jq -r '.[].assets.links[].url' \
                | while read -r url; do wget -P apks --no-verbose "$url" || { echo "Warning: failed to download $url, skipping"; echo "$url" >> /tmp/fdroid_download_errors; }; done

              latest_release_data=$(
                curl -L \
                  "https://gitlab.com/api/v4/projects/$encoded_repo/releases?per_page=1"
              )
              latest_version=$(echo "$latest_release_data" | jq -r '.[0].tag_name')
            else
              echo "Unknown provider"
              exit 1
            fi

            echo "Downloaded APKs. Saving latest version $latest_version"
            mkdir -p current-versions
            echo "$latest_version" > current-versions/$id.txt
          done

          echo "Deleting non-APK files"
          (cd apks && find . -type f ! -name '*.apk' -delete)

          echo "do_update=true" >> "$GITHUB_ENV"

          if [[ -f /tmp/fdroid_download_errors ]]; then
            echo "::warning::Some APKs failed to download:"
            cat /tmp/fdroid_download_errors
            echo "download_errors=true" >> "$GITHUB_ENV"
          fi

          echo "Done"
          ls -lha apks
      
      - name: Load KeyStore file
        if: ${{ env.do_update == 'true' }}
        run: echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d - > repo/keystore.p12
      
      - uses: docker/setup-qemu-action@v3
        if: ${{ env.do_update == 'true' }}

      - uses: docker/setup-buildx-action@v3
        if: ${{ env.do_update == 'true' }}

      - name: Build F-Droid Repo Generator
        if: ${{ env.do_update == 'true' }}
        uses: docker/build-push-action@v6
        with:
          context: ./fdroid-repo-generator
          load: true
          tags: fdroid-repo-generator
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Write index.html
        if: ${{ env.do_update == 'true' }}
        run: |
          mkdir -p deploy
          cat <<EOF >> deploy/index.html
          <html>
          <head>
          <meta http-equiv="refresh" content="0; url=fdroid/repo" />
          </head>
          <body>
          <p><a href="fdroid/repo">Click here if redirect is not working</a></p>
          </body>
          </html>
          EOF

      - name: Run F-Droid Repo Generator
        if: ${{ env.do_update == 'true' }}
        run: |
          docker run --rm \
            -v $(pwd)/apks:/apks \
            -v $(pwd)/deploy:/deploy \
            -v $(pwd)/repo:/repobase \
            -w /repo \
            -e REPO_KEYALIAS="${{ secrets.REPO_KEYALIAS }}" \
            -e KEYSTOREPASS="${{ secrets.KEYSTOREPASS }}" \
            -e KEYPASS="${{ secrets.KEYPASS }}" \
            -e KEYDNAME="${{ secrets.KEYDNAME }}" \
            fdroid-repo-generator

      - name: Deploy to Github pages
        if: ${{ env.do_update == 'true' }}
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./deploy
          force_orphan: true
          cname: fdroid.nyxnord.de
      
      - name: PostProcess
        id: postprocess
        if: ${{ env.do_update == 'true' }}
        run: |
          echo "Configuring git"
          git config --global user.email "actions@github.com"
          git config --global user.name "GitHub Actions"

          echo "Committing changed tracking files"
          git add -A || true
          git commit -m "Update versions" && git push || true

          echo "executed_update=true" >> "$GITHUB_OUTPUT"

      - name: Fail on download errors
        if: ${{ env.download_errors == 'true' }}
        run: |
          echo "::error::Some APKs failed to download. Check the Update step logs for details."
          exit 1
