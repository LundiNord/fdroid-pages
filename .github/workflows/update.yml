name: Update

on:
  schedule:
    - cron: '35 0 * * *'
  workflow_dispatch:
    inputs:
      force_update:
        type: boolean
        description: 'Force update/build'
        default: false

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    outputs:
      executed_update: ${{ steps.postprocess.outputs.executed_update }}
    steps:
      - uses: actions/checkout@v4

      - name: Update
        id: update
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          WETTER_PAT: ${{ secrets.WETTER_PAT }}
        run: |
          set -e
          declare -a repo_infos=(
            "de.nyxnord.kraftlog;github;LundiNord/KraftLog"
            "de.nyxnord.tagalarm;github;LundiNord/TagAlarm"
            "de.lundinord.wetter;github;LundiNord/Wetter;WETTER_PAT"
          )

          get_repo_token() {
            # Optional 4th field: name of a secret holding a PAT for private repos.
            # Defaults to the workflow's own GITHUB_TOKEN.
            local secret_name="${1:-}"
            if [[ -n "$secret_name" ]]; then
              eval "echo \${$secret_name:-}"
            else
              echo "$GITHUB_TOKEN"
            fi
          }

          force_update="${{ inputs.force_update }}"
          
          if [[ "$force_update" != "true" ]]; then
            echo "Checking if updates are required..."

            update_required=false

            for repo_info in ${repo_infos[@]}; do
              IFS=';' read -r id provider repo token_secret <<< "$repo_info"

              repo_token=$(get_repo_token "$token_secret")

              echo "Checking if $id needs updating"

              current_deployed_release=$(cat current-versions/$id.txt || echo "")
              echo "Currently deployed version is '$current_deployed_release'"

              latest_version=""
              if [[ "$provider" == "github" ]]; then
                latest_release_data=$(
                  curl -L \
                    -H "Accept: application/vnd.github+json" \
                    -H "Authorization: Bearer ${repo_token}" \
                    -H "X-GitHub-Api-Version: 2022-11-28" \
                    https://api.github.com/repos/$repo/releases/latest
                )
                latest_version=$(echo "$latest_release_data" | jq -r '.name')
              elif [[ "$provider" == "gitlab" ]]; then
                encoded_repo="${repo//\//%2F}"
                latest_release_data=$(
                  curl -L \
                    "https://gitlab.com/api/v4/projects/$encoded_repo/releases?per_page=1"
                )
                latest_version=$(echo "$latest_release_data" | jq -r '.[0].tag_name')
              else
                echo "Unknown provider"
                exit 1
              fi

              echo "Latest version is '$latest_version'"
              if [[ "$current_deployed_release" != "$latest_version" ]]; then
                echo "Update required"
                update_required=true
                break
              fi
            done

            if [[ "$update_required" != "true" ]]; then
              echo "Everything is up-to-date; No update required"
              exit 0
            fi
          fi

          echo "Downloading APKs"
          mkdir -p apks
          rm -f /tmp/fdroid_download_errors

          for repo_info in ${repo_infos[@]}; do
            IFS=';' read -r id provider repo token_secret <<< "$repo_info"

            repo_token=$(get_repo_token "$token_secret")

            echo "Downloading APKs for $id"
            mkdir -p "apks/$id"

            latest_version=""
            if [[ "$provider" == "github" ]]; then
              curl -L \
                -H "Accept: application/vnd.github+json" \
                -H "Authorization: Bearer ${repo_token}" \
                -H "X-GitHub-Api-Version: 2022-11-28" \
                https://api.github.com/repos/$repo/releases?per_page=3 \
                | jq -r '.[].assets[].browser_download_url' \
                | grep -v '\-debug\.apk' \
                | grep -v '\-unsigned\.apk' \
                | while read -r url; do wget -P "apks/$id" --no-verbose "$url" || { echo "Warning: failed to download $url, skipping"; echo "$url" >> /tmp/fdroid_download_errors; }; done

              latest_release_data=$(
                curl -L \
                  -H "Accept: application/vnd.github+json" \
                  -H "Authorization: Bearer ${repo_token}" \
                  -H "X-GitHub-Api-Version: 2022-11-28" \
                  https://api.github.com/repos/$repo/releases/latest
              )
              latest_version=$(echo "$latest_release_data" | jq -r '.name')
            elif [[ "$provider" == "gitlab" ]]; then
              encoded_repo="${repo//\//%2F}"
              curl -L \
                "https://gitlab.com/api/v4/projects/$encoded_repo/releases?per_page=3" \
                | jq -r '.[].assets.links[].url' \
                | grep -v '\-debug\.apk' \
                | grep -v '\-unsigned\.apk' \
                | while read -r url; do wget -P "apks/$id" --no-verbose "$url" || { echo "Warning: failed to download $url, skipping"; echo "$url" >> /tmp/fdroid_download_errors; }; done

              latest_release_data=$(
                curl -L \
                  "https://gitlab.com/api/v4/projects/$encoded_repo/releases?per_page=1"
              )
              latest_version=$(echo "$latest_release_data" | jq -r '.[0].tag_name')
            else
              echo "Unknown provider"
              exit 1
            fi

            echo "Downloaded APKs. Saving latest version $latest_version"
            mkdir -p current-versions
            echo "$latest_version" > current-versions/$id.txt
          done

          echo "Flattening and deduplicating APKs"
          mkdir -p apks/_all
          for dir in apks/*/; do
            [ "$dir" = "apks/_all/" ] && continue
            for f in "$dir"*.apk; do
              [ -f "$f" ] || continue
              base=$(basename "$f")
              app_id=$(basename "$dir")
              mv "$f" "apks/_all/${app_id}_${base}"
            done
          done
          for dir in apks/*/; do
            [ "$dir" = "apks/_all/" ] && continue
            rm -rf "$dir"
          done
          mv apks/_all/* apks/
          rmdir apks/_all

          echo "Deleting non-APK files"
          (cd apks && find . -type f ! -name '*.apk' -delete)

          echo "do_update=true" >> "$GITHUB_ENV"

          if [[ -f /tmp/fdroid_download_errors ]]; then
            echo "::warning::Some APKs failed to download:"
            cat /tmp/fdroid_download_errors
            echo "download_errors=true" >> "$GITHUB_ENV"
          fi

          echo "Done"
          ls -lha apks
      
      - name: Load KeyStore file
        if: ${{ env.do_update == 'true' }}
        run: echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d - > repo/keystore.p12
      
      - uses: docker/setup-qemu-action@v3
        if: ${{ env.do_update == 'true' }}

      - uses: docker/setup-buildx-action@v3
        if: ${{ env.do_update == 'true' }}

      - name: Build F-Droid Repo Generator
        if: ${{ env.do_update == 'true' }}
        uses: docker/build-push-action@v6
        with:
          context: ./fdroid-repo-generator
          load: true
          tags: fdroid-repo-generator
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Write index.html
        if: ${{ env.do_update == 'true' }}
        run: |
          mkdir -p deploy
          cat <<EOF >> deploy/index.html
          <html>
          <head>
          <meta http-equiv="refresh" content="0; url=fdroid/repo" />
          </head>
          <body>
          <p><a href="fdroid/repo">Click here if redirect is not working</a></p>
          </body>
          </html>
          EOF

      - name: Run F-Droid Repo Generator
        if: ${{ env.do_update == 'true' }}
        run: |
          docker run --rm \
            -v $(pwd)/apks:/apks \
            -v $(pwd)/deploy:/deploy \
            -v $(pwd)/repo:/repobase \
            -w /repo \
            -e REPO_KEYALIAS="${{ secrets.REPO_KEYALIAS }}" \
            -e KEYSTOREPASS="${{ secrets.KEYSTOREPASS }}" \
            -e KEYPASS="${{ secrets.KEYPASS }}" \
            -e KEYDNAME="${{ secrets.KEYDNAME }}" \
            fdroid-repo-generator

      - name: Deploy to Github pages
        if: ${{ env.do_update == 'true' }}
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./deploy
          force_orphan: true
          cname: fdroid.nyxnord.de
      
      - name: PostProcess
        id: postprocess
        if: ${{ env.do_update == 'true' }}
        run: |
          echo "Configuring git"
          git config --global user.email "actions@github.com"
          git config --global user.name "GitHub Actions"

          echo "Committing changed tracking files"
          git add -A || true
          git commit -m "Update versions" && git push || true

          echo "executed_update=true" >> "$GITHUB_OUTPUT"

      - name: Fail on download errors
        if: ${{ env.download_errors == 'true' }}
        run: |
          echo "::error::Some APKs failed to download. Check the Update step logs for details."
          exit 1
